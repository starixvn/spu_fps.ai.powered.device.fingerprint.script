[tool:pytest]
# Pytest configuration file

# Test discovery
testpaths = src/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    browser: mark test to run with specific browser
    login: mark test as login functionality test
    fingerprint: mark test as fingerprint test
    slow: mark test as slow running
    integration: mark test as integration test
    unit: mark test as unit test
    smoke: mark test as smoke test
    regression: mark test as regression test

# Output options
addopts = 
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    -v
    --html=reports/pytest_report.html
    --self-contained-html
    --json-report
    --json-report-file=reports/pytest_report.json

# Minimum version
minversion = 7.0

# Test timeout (in seconds)
timeout = 300

# Parallel execution
# addopts = -n auto  # Uncomment to enable parallel execution

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage configuration (if pytest-cov is installed)
# addopts = --cov=src --cov-report=html --cov-report=term-missing
