# Pytest configuration for easier testing
[tool:pytest]
# Test discovery
testpaths = src/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --color=yes
    --durations=10
    --maxfail=5

# Markers
markers =
    browser: mark test to run with specific browser
    login: mark test as login functionality test
    fingerprint: mark test as fingerprint test
    slow: mark test as slow running
    integration: mark test as integration test
    unit: mark test as unit test
    smoke: mark test as smoke test
    regression: mark test as regression test
    chrome: tests that run on Chrome browser
    firefox: tests that run on Firefox browser
    edge: tests that run on Edge browser
    dual_login: tests that perform dual login
    user_agent: tests related to user agent spoofing

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test timeout
timeout = 300

# Minimum version requirements
minversion = 6.0
