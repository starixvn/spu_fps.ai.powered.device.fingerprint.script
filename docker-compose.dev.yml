version: '3.8'

services:
  fps-app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=local
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - fps-network
    depends_on:
      - redis-dev
      - postgres-dev

  redis-dev:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - fps-network

  postgres-dev:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=fps_local
      - POSTGRES_USER=fps_local_user
      - POSTGRES_PASSWORD=local_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - fps-network

volumes:
  postgres_dev_data:

networks:
  fps-network:
    driver: bridge
