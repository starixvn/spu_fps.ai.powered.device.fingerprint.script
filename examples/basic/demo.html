<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS Device Fingerprinting - Basic Demo</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }
      .container {
        background: white;
        border-radius: 10px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #333;
        text-align: center;
        margin-bottom: 30px;
      }
      .fingerprint-display {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 5px;
        padding: 20px;
        margin: 20px 0;
        font-family: "Courier New", monospace;
        font-size: 14px;
        max-height: 400px;
        overflow-y: auto;
      }
      .button {
        background: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 10px 5px;
        font-size: 16px;
      }
      .button:hover {
        background: #0056b3;
      }
      .storage-info {
        background: #e3f2fd;
        border-left: 4px solid #2196f3;
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
      }
      .storage-item {
        margin: 5px 0;
        padding: 5px;
        background: #f5f5f5;
        border-radius: 3px;
      }
      .storage-item strong {
        color: #1976d2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔍 FPS Device Fingerprinting Demo</h1>
      <div style="text-align: center">
        <button class="button" onclick="collectFingerprint()">
          Collect All Data
        </button>
        <button class="button" onclick="showAllGroups()">📊 Show All Groups</button>
        <button class="button" onclick="collectIPs()">Show WebRTC Data</button>
        <button class="button" onclick="showDeviceInfo()">Show Device Info</button>
        <button class="button" onclick="getStorageData()">
          Get Storage Data
        </button>
        <button class="button" onclick="loginTransaction()" style="background: #28a745;">
          🔐 Login Transaction
        </button>
      </div>

      <!-- Hidden elements for transaction data -->
      <input type="hidden" id="detecas-analysis" name="detecas-analysis" value="DetecasAnalysis_Sample_Data" />

      <div id="statusDisplay" class="fingerprint-display" style="display: block">
        <h3>Data Availability Status:</h3>
        <div id="statusInfo">
          <p>🔄 Checking data availability...</p>
        </div>
      </div>

      <div
        id="fingerprintDisplay"
        class="fingerprint-display"
        style="display: none"
      >
        <h3>Collected Fingerprint Data:</h3>
        <pre id="fingerprintData"></pre>
      </div>

      <div
        id="storageDisplay"
        class="fingerprint-display"
        style="display: none"
      >
        <h3>Tagging:</h3>
        <pre id="storageData"></pre>
      </div>

      <div
        id="loginResponse"
        class="fingerprint-display"
        style="display: none"
      >
        <h3>Login Transaction Response:</h3>
        <pre id="loginData"></pre>
      </div>
    </div>

    <script>
      let currentFingerprint = null;
      let scriptsLoaded = false;

      function loadMainScript() {
        // Load fingerprint script first
        const taggingScript = document.createElement("script");
        taggingScript.src = "/libs/apd-unified.min.js";

        taggingScript.onload = () => {
          scriptsLoaded = true;
          toggleStorageButton(true);
          console.log('✅ Fingerprint script loaded successfully');
        }

        // taggingScript.onload = () => {
        //   // Load tagging script after fingerprint script loads
        //   const fingerprintScript = document.createElement("script");
        //   fingerprintScript.src = "/libs/apd-routing.min.js";
          
        //   fingerprintScript.onload = () => {
        //     scriptsLoaded = true;
        //     toggleStorageButton(true);
        //     console.log('✅ Both fingerprint and tagging scripts loaded successfully');
        //   };
          
        //   fingerprintScript.onerror = () => {
        //     console.error('❌ Failed to load tagging script');
        //   };
          
        //   document.head.appendChild(fingerprintScript);
        // };

        // taggingScript.onerror = () => {
        //   console.error('❌ Failed to load fingerprint script');
        // };

        document.head.appendChild(taggingScript);
      }

      async function collectFingerprint() {
        try {
          // Wait a bit for the fingerprinting to complete (if needed)
          await new Promise(resolve => setTimeout(resolve, 1000));

          // Check if fingerprint data is available in window objects
          if (!window.f5Attributes) {
            document.getElementById("fingerprintData").textContent =
              "F5 fingerprint data not ready yet. Please try again in a moment.";
            document.getElementById("fingerprintDisplay").style.display = "block";
            return;
          }

          // Collect data from window objects  
          currentFingerprint = {
            f5Data: window.f5Attributes || null,
            webrtcData: window.webrtcData || null,
            deviceInfo: window.deviceInfo || null,
            timestamp: new Date().toISOString(),
            version: "1.9.0"
          };

          // Format and display the data
          const formattedData = {
            ...currentFingerprint,
            // Add summary information
            summary: {
              hardwareAvailable: !!(window.f5Attributes && (window.f5Attributes.platform || window.f5Attributes.hardwareConcurrency)),
              browserAvailable: !!(window.f5Attributes && (window.f5Attributes.browserName || window.f5Attributes.userAgent)),
              audioAvailable: !!(window.f5Attributes && (window.f5Attributes.audio !== undefined || window.f5Attributes.audioBaseLatency !== undefined)),
              preferencesAvailable: !!(window.f5Attributes && (window.f5Attributes.languages || window.f5Attributes.timezone)),
              graphicsAvailable: !!(window.f5Attributes && (window.f5Attributes.canvas || window.f5Attributes.webglBasics)),
              webrtcAvailable: window.webRTCData !== undefined,
              deviceInfoAvailable: !!window.deviceInfo,
              totalF5Attributes: window.f5Attributes ? Object.keys(window.f5Attributes).length : 0
            }
          };

          document.getElementById("fingerprintData").textContent =
            JSON.stringify(formattedData, null, 2);
          document.getElementById("fingerprintDisplay").style.display = "block";

        } catch (error) {
          document.getElementById("fingerprintData").textContent =
            "Error: " + error.message;
          document.getElementById("fingerprintDisplay").style.display = "block";
          console.error("❌ Error collecting fingerprint:", error);
        }
      }

      function toggleStorageButton(enabled) {
        const storageButton = document.querySelector(
          'button[onclick="getStorageData()"]'
        );

        if (!storageButton) return;

        storageButton.disabled = !enabled;
        storageButton.style.opacity = enabled ? "1" : "0.5";
        storageButton.style.cursor = enabled ? "pointer" : "not-allowed";
        storageButton.title = enabled
          ? "Ready to get storage data"
          : "Waiting for scripts to load...";

        if (enabled) {
          // Storage button is now enabled
        }
      }

      // New functions for handling window-based data access
      function checkDataAvailability() {
        const checkInterval = setInterval(() => {
          const status = {
            f5: !!window.f5Attributes,
            webrtc: window.webRTCData !== undefined,
          };

          let statusHtml = "<div style='font-family: monospace;'>";
          statusHtml += `<p>🖥️ Hardware Data: ${status.f5 ? '✅ Available' : '⏳ Loading...'}</p>`;
          statusHtml += `<p>🌐 Browser Data: ${status.f5 ? '✅ Available' : '⏳ Loading...'}</p>`;
          statusHtml += `<p>🎵 Audio Data: ${status.f5 ? '✅ Available' : '⏳ Loading...'}</p>`;
          statusHtml += `<p>⚙️ Preferences Data: ${status.f5 ? '✅ Available' : '⏳ Loading...'}</p>`;
          statusHtml += `<p>🎨 Graphics Data: ${status.f5 ? '✅ Available' : '⏳ Loading...'}</p>`;
          statusHtml += `<p>🌐 WebRTC Data: ${status.webrtc ? '✅ Available' : '⏳ Loading...'}</p>`;
          statusHtml += "</div>";

          document.getElementById("statusInfo").innerHTML = statusHtml;

          // If all data is available, we can stop checking
          if (status.f5 && status.webrtc) {
            clearInterval(checkInterval);
            statusHtml += "<p style='color: green; font-weight: bold;'>🎉 All fingerprint groups are ready! Use the group buttons to explore data.</p>";
            document.getElementById("statusInfo").innerHTML = statusHtml;
          }
        }, 1000);

        // Stop checking after 30 seconds to avoid infinite loop
        setTimeout(() => clearInterval(checkInterval), 30000);
      }

      // Combined function to show all groups
      function showAllGroups() {
        const f5Data = window.f5Attributes;
        if (!f5Data) {
          document.getElementById("fingerprintData").textContent = "F5 data not available yet.";
          document.getElementById("fingerprintDisplay").style.display = "block";
          return;
        }

        // Define groups data
        const hardwareData = {
          plf: f5Data.hardware.plf,
          ccl: f5Data.hardware.ccl,
          arc: f5Data.hardware.arc,
          osc: f5Data.hardware.osc,
          hwc: f5Data.hardware.hwc,
          dvm: f5Data.hardware.dvm
        };

        const browserData = {
          brn: f5Data.browser.brn,
          osn: f5Data.browser.osn,
          uag: f5Data.browser.uag,
          vdr: f5Data.browser.vdr,
          vfl: f5Data.browser.vfl,
          plg: f5Data.browser.plg,
          pve: f5Data.browser.pve
        };

        const audioData = {
          aud: f5Data.audio.aud,
          abl: f5Data.audio.abl
        };

        const preferencesData = {
          lng: f5Data.preferences.lng,
          tze: f5Data.preferences.tze,
          tsp: f5Data.preferences.tsp,
          ssg: f5Data.preferences.ssg,
          odb: f5Data.preferences.odb,
          lst: f5Data.preferences.lst,
          idb: f5Data.preferences.idb,
          cke: f5Data.preferences.cke
        };

        const graphicsData = {
          cnv: f5Data.graphics.cnv,
          wgb: f5Data.graphics.wgb,
          wgx: f5Data.graphics.wgx,
          fnt: f5Data.graphics.fnt,
          fpr: f5Data.graphics.fpr,
          scr: f5Data.graphics.scr,
          sfr: f5Data.graphics.sfr,
          cld: f5Data.graphics.cld,
          clg: f5Data.graphics.clg
        };

        // Extract all groups from f5Attributes - simple format
        const displayData = {
          "SUMMARY": {
            timestamp: new Date().toISOString(),
            totalAttributes: Object.keys(f5Data).length,
            totalGroups: 5
          },
          
          "HARDWARE": hardwareData,
          "BROWSER": browserData,
          "AUDIO": audioData,
          "PREFERENCES": preferencesData,
          "GRAPHICS": graphicsData
        };

        document.getElementById("fingerprintData").textContent = 
          JSON.stringify(displayData, null, 2);
        document.getElementById("fingerprintDisplay").style.display = "block";
      }

      function showDeviceInfo() {
        if (!window.deviceInfo) {
          document.getElementById("fingerprintData").textContent = "Device info not available yet.";
          document.getElementById("fingerprintDisplay").style.display = "block";
          return;
        }

        document.getElementById("fingerprintData").textContent = 
          JSON.stringify(window.deviceInfo, null, 2);
        document.getElementById("fingerprintDisplay").style.display = "block";
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadMainScript();
        toggleStorageButton(false);
        // Start checking data availability
        checkDataAvailability();
      });

      async function collectIPs() {
        try {
          // Check if WebRTC data is available in window
          if (!window.webRTCData) {
            document.getElementById("fingerprintData").textContent =
              '""';
            document.getElementById("fingerprintDisplay").style.display = "block";
            return;
          }

          const webrtcData = window.webRTCData;

          document.getElementById("fingerprintData").textContent =
            JSON.stringify(webrtcData, null, 2);
          document.getElementById("fingerprintDisplay").style.display = "block";
        } catch (error) {
          document.getElementById("fingerprintData").textContent =
            "Error: " + error.message;
          document.getElementById("fingerprintDisplay").style.display = "block";
        }
      }



      // Removed auto-collect since it's now handled in loadActivatorThenOthers
      // window.addEventListener('load', function() {
      //     setTimeout(collectFingerprint, 1000);
      // });

      // Storage Management Functions
      async function getStorageData() {
        // Check if scripts are loaded before proceeding
        if (!scriptsLoaded) {
          alert(
            "⏳ Vui lòng đợi scripts load xong trước khi get storage data!"
          );
          return;
        }

        try {
          // Get tagging first (as before)
          const tagging = window.TaggingValue;

          // Get all storage values for both keys
          const storageData = await getAllStorageValues();

          const result = {
            tagging: tagging,
            storage: storageData,
          };

          document.getElementById("storageData").textContent = JSON.stringify(
            result,
            null,
            2
          );
          document.getElementById("storageDisplay").style.display = "block";
        } catch (error) {
          document.getElementById("storageData").textContent =
            "Error: " + error.message;
          document.getElementById("storageDisplay").style.display = "block";
        }
      }

      // Function to get all storage values for both old and new keys
      async function getAllStorageValues() {
        const oldKey = "(global.c3)";

        const storageResults = {
          indexedDB: {
            oldKey: null,
            newKey: null,
          },
          localStorage: {
            oldKey: null,
            newKey: null,
          },
          cookies: {
            oldKey: null,
            newKey: null,
          },
          cacheAPI: {
            value: null,
          },
          windowName: {
            value: null,
          },
        };

        try {
          // IndexedDB
          storageResults.indexedDB.oldKey = await getIndexedDBValue(oldKey);
          storageResults.indexedDB.newKey = await getIndexedDBValue("pwr_client_sync");

          // LocalStorage
          storageResults.localStorage.oldKey = getLocalStorageValue(oldKey);
          storageResults.localStorage.newKey = getLocalStorageValue("awb_visitor_session");

          // Cookies
          storageResults.cookies.oldKey = getCookieValue("gfp");
          storageResults.cookies.newKey = getCookieValue("cke_anchor_key");

          // Cache API (stub)
          storageResults.cacheAPI.value = await getCacheAPIValue("msn_identity_tag");

          // WindowName
          storageResults.windowName.value = getWindowNameValue(oldKey);
        } catch (error) {}

        return storageResults;
      }

      // IndexedDB getter
      async function getIndexedDBValue(key) {
        return new Promise((resolve) => {
          try {
            const indexedDbObj =
              window.indexedDB ||
              window.mozIndexedDB ||
              window.webkitIndexedDB ||
              window.msIndexedDB ||
              window.shimIndexedDB;

            if (!indexedDbObj) {
              resolve(null);
              return;
            }

            const request = indexedDbObj.open("indexedDB_ec", 3);

            request.onerror = function () {
              resolve(null);
            };

            request.onsuccess = function (event) {
              try {
                const db = event.target.result;

                if (db && db.objectStoreNames.contains("ec")) {
                  const transaction = db.transaction(["ec"], "readonly");
                  const objectStore = transaction.objectStore("ec");
                  const getRequest = objectStore.get(key);

                  getRequest.onsuccess = function () {
                    resolve(getRequest.result ? getRequest.result.value : null);
                  };

                  getRequest.onerror = function () {
                    resolve(null);
                  };
                } else {
                  resolve(null);
                }
              } catch (exception) {
                resolve(null);
              }
            };

            request.onupgradeneeded = function () {
              resolve(null);
            };
          } catch (exception) {
            resolve(null);
          }
        });
      }

      // LocalStorage getter
      function getLocalStorageValue(key) {
        try {
          if (window.localStorage) {
            return window.localStorage.getItem(key);
          }
          return null;
        } catch (exception) {
          return null;
        }
      }

      // Cookie getter
      function getCookieValue(key) {
        try {
          const name = key + "=";
          const ca = document.cookie.split(";");

          for (let i = 0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) === " ") {
              c = c.substring(1);
            }
            if (c.indexOf(name) === 0) {
              return c.substring(name.length, c.length);
            }
          }
          return null;
        } catch (error) {
          return null;
        }
      }

      // Cache API getter (stub implementation)
      async function getCacheAPIValue(key) {
        try {
          if ("caches" in window) {
            const cache = await caches.open(key);
            const response = await cache.match(new Request(`/cache/${key}`));

            if (response) {
              const data = await response.text();
              return data;
            }
          }
          return null;
        } catch (exception) {
          return null;
        }
      }

      function getWindowNameValue(key) {
        try {
          if (typeof window === "undefined") {
            return null;
          }

          const currentValue = window.name;

          if (!currentValue || currentValue.trim() === "") {
            return null;
          }

          return currentValue;
        } catch (exception) {
          console.warn("WindowName get exception:", exception);
          return null;
        }
      }


      // Enhanced function to get hidden field values
      function getHiddenFieldValue(fieldId) {
        // Try by ID first
        let element = document.getElementById(fieldId);
        if (element && element.value) {
          return element.value;
        }

        // Try by name attribute
        element = document.querySelector(`[name="${fieldId}"]`);
        if (element && element.value) {
          return element.value;
        }

        // Try querySelector with multiple selectors
        element = document.querySelector(`input[id="${fieldId}"], input[name="${fieldId}"]`);
        if (element && element.value) {
          return element.value;
        }

        return "";
      }

      // Login Transaction function
      async function loginTransaction() {
        try {
          // Show loading state
          document.getElementById("loginData").textContent = "🔄 Sending login transaction...";
          document.getElementById("loginResponse").style.display = "block";

          // Get current date
          const now = new Date();
          const subscriberDate = now.toISOString();

          // Get values from hidden elements with enhanced method
          const di = getHiddenFieldValue("__di");
          const sessionKey = getHiddenFieldValue("__fdi");

          const currentUrl = window.location.href;
          const userAgent = navigator.userAgent;

          // Prepare transaction data
          const transactionData = {
            "Account": "demo_user", // Sample login name
            "Action": "Login",
            "ActionResult": "Success",
            "AcceptsTypes": "application/json",
            "Platform": "Web",
            "UserAgent": userAgent, // Add missing UserAgent field
            "Screen": "1920x1080",
            "Ip": "192.168.1.10",
            "FakeIp": "",
            "Url": currentUrl,
            "__di": di,
            "Bi": "eyJyZXN1bHQiOnsiYm90IjpmYWxzZX0sImRldGVjdGlvbiI6IiIsImNvbXBvbmVudCI6IiIsImlzVmVyMyI6dHJ1ZSwiSnNjS2V5IjoiYmQ0NjhkZmVjZWMwNGMwZDk1MDY2YmY3MzgzNWNmOGMifQ==",
            "Token": "", 
            "DetecasAnalysis": "", 
            "Subscriber": "Alpha", 
            "LoginTime": new Date().toISOString(),
            "CaptchaResult": "",
            "SessionKey": sessionKey,
            "TransDate": new Date().toISOString(),
          };

          // Send to the specified endpoint http://localhost:5282/FPS/CheckTransaction
          const response = await fetch("https://fpt-local.nexdev.net/FPS/CheckTransaction", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify(transactionData),
          });

          if (response.ok) {
            const responseData = await response.json();
            
            const displayData = {
              status: "Success",
              sentData: transactionData,
              serverResponse: responseData,
              timestamp: new Date().toISOString()
            };
            
            document.getElementById("loginData").textContent = JSON.stringify(displayData, null, 2);
          } else {
            // Handle error response
            const errorText = await response.text();
            console.error("❌ Transaction failed:", response.status, errorText);
            
            const errorData = {
              status: "Error",
              error: `${response.status} ${response.statusText}`,
              errorDetails: errorText,
              sentData: transactionData,
              timestamp: new Date().toISOString()
            };
            
            document.getElementById("loginData").textContent = JSON.stringify(errorData, null, 2);
          }

        } catch (error) {
          console.error("❌ Login transaction error:", error);
          
          const errorData = {
            status: "Error",
            error: error.message,
            timestamp: new Date().toISOString()
          };
          
          document.getElementById("loginData").textContent = JSON.stringify(errorData, null, 2);
        }
        
        document.getElementById("loginResponse").style.display = "block";
      }
    </script>
  </body>
</html>
