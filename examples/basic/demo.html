<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS Device Fingerprinting - Basic Demo</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }
      .container {
        background: white;
        border-radius: 10px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #333;
        text-align: center;
        margin-bottom: 30px;
      }
      .fingerprint-display {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 5px;
        padding: 20px;
        margin: 20px 0;
        font-family: "Courier New", monospace;
        font-size: 14px;
        max-height: 400px;
        overflow-y: auto;
      }
      .button {
        background: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 10px 5px;
        font-size: 16px;
      }
      .button:hover {
        background: #0056b3;
      }
      .hash-display {
        font-family: "Courier New", monospace;
        font-size: 18px;
        font-weight: bold;
        color: #28a745;
        margin: 10px 0;
      }
      .storage-info {
        background: #e3f2fd;
        border-left: 4px solid #2196f3;
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
      }
      .storage-item {
        margin: 5px 0;
        padding: 5px;
        background: #f5f5f5;
        border-radius: 3px;
      }
      .storage-item strong {
        color: #1976d2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔍 FPS Device Fingerprinting Demo</h1>
      <div style="text-align: center">
        <button class="button" onclick="collectFingerprint()">
          Collect All Data
        </button>
        <button class="button" onclick="showF4Data()">Show F4 Data</button>
        <button class="button" onclick="showF5Data()">Show F5 Data</button>
        <button class="button" onclick="collectIPs()">Show WebRTC Data</button>
        <button class="button" onclick="showDeviceInfo()">Show Device Info</button>
        <button class="button" onclick="generateHash()">Generate Hash</button>
        <button class="button" onclick="sendToServer()">Send to Server</button>
        <button class="button" onclick="getStorageData()">
          Get Storage Data
        </button>
      </div>

      <div id="statusDisplay" class="fingerprint-display" style="display: block">
        <h3>Data Availability Status:</h3>
        <div id="statusInfo">
          <p>🔄 Checking data availability...</p>
        </div>
      </div>

      <div id="hashDisplay" class="hash-display" style="display: none">
        <strong>Fingerprint Hash:</strong> <span id="hashValue"></span>
      </div>

      <div
        id="fingerprintDisplay"
        class="fingerprint-display"
        style="display: none"
      >
        <h3>Collected Fingerprint Data:</h3>
        <pre id="fingerprintData"></pre>
      </div>

      <div
        id="serverResponse"
        class="fingerprint-display"
        style="display: none"
      >
        <h3>Server Response:</h3>
        <pre id="serverData"></pre>
      </div>

      <div
        id="storageDisplay"
        class="fingerprint-display"
        style="display: none"
      >
        <h3>Tagging:</h3>
        <pre id="storageData"></pre>
      </div>
    </div>

    <script>
      let currentFingerprint = null;
      let scriptsLoaded = false;

      function loadMainScript() {
        const mainScript = document.createElement("script");
        mainScript.src = "/libs/apd-express.js";

        mainScript.onload = async () => {
          try {
            scriptsLoaded = true;
            toggleStorageButton(true);
          } catch (error) {}
        };

        document.head.appendChild(mainScript);
      }

      async function collectFingerprint() {
        try {
          // Wait a bit for the fingerprinting to complete (if needed)
          await new Promise(resolve => setTimeout(resolve, 1000));

          // Check if fingerprint data is available in window objects
          if (!window.f4Attributes && !window.f5Attributes) {
            document.getElementById("fingerprintData").textContent =
              "Fingerprint data not ready yet. Please try again in a moment.";
            document.getElementById("fingerprintDisplay").style.display = "block";
            return;
          }

          // Collect data from window objects  
          currentFingerprint = {
            f4Data: window.f4Attributes || null,
            f5Data: window.f5Attributes || null,
            webrtcData: window.webrtcData || null,
            deviceInfo: window.deviceInfo || null,
            timestamp: new Date().toISOString(),
            version: "1.9.0"
          };

          // Format and display the data
          const formattedData = {
            ...currentFingerprint,
            // Add summary information
            summary: {
              f4Available: !!window.f4Attributes,
              f5Available: !!window.f5Attributes, 
              webrtcAvailable: !!window.webrtcData,
              deviceInfoAvailable: !!window.deviceInfo
            }
          };

          document.getElementById("fingerprintData").textContent =
            JSON.stringify(formattedData, null, 2);
          document.getElementById("fingerprintDisplay").style.display = "block";

          console.log("🎯 Fingerprint collected from window objects:", formattedData);

        } catch (error) {
          document.getElementById("fingerprintData").textContent =
            "Error: " + error.message;
          document.getElementById("fingerprintDisplay").style.display = "block";
          console.error("❌ Error collecting fingerprint:", error);
        }
      }

      function toggleStorageButton(enabled) {
        const storageButton = document.querySelector(
          'button[onclick="getStorageData()"]'
        );

        if (!storageButton) return;

        storageButton.disabled = !enabled;
        storageButton.style.opacity = enabled ? "1" : "0.5";
        storageButton.style.cursor = enabled ? "pointer" : "not-allowed";
        storageButton.title = enabled
          ? "Ready to get storage data"
          : "Waiting for scripts to load...";

        if (enabled) {
          console.log("🔓 Storage button enabled!");
        }
      }

      // New functions for handling window-based data access
      function checkDataAvailability() {
        const checkInterval = setInterval(() => {
          const status = {
            f4: !!window.f4Attributes,
            f5: !!window.f5Attributes,
            webrtc: !!window.webrtcData,
            deviceInfo: !!window.deviceInfo
          };

          let statusHtml = "<div style='font-family: monospace;'>";
          statusHtml += `<p>📊 F4 Data (Audio, Browser, Hardware, Preferences): ${status.f4 ? '✅ Available' : '⏳ Loading...'}</p>`;
          statusHtml += `<p>🎨 F5 Data (Graphics): ${status.f5 ? '✅ Available' : '⏳ Loading...'}</p>`;
          statusHtml += `<p>🌐 WebRTC Data: ${status.webrtc ? '✅ Available' : '⏳ Loading...'}</p>`;
          statusHtml += `<p>📱 Device Info: ${status.deviceInfo ? '✅ Available' : '⏳ Loading...'}</p>`;
          statusHtml += "</div>";

          document.getElementById("statusInfo").innerHTML = statusHtml;

          // If all data is available, we can stop checking
          if (status.f4 && status.f5 && status.webrtc && status.deviceInfo) {
            clearInterval(checkInterval);
            statusHtml += "<p style='color: green; font-weight: bold;'>🎉 All fingerprint data is ready!</p>";
            document.getElementById("statusInfo").innerHTML = statusHtml;
          }
        }, 1000);

        // Stop checking after 30 seconds to avoid infinite loop
        setTimeout(() => clearInterval(checkInterval), 30000);
      }

      function showF4Data() {
        if (!window.f4Attributes) {
          document.getElementById("fingerprintData").textContent = "F4 data not available yet.";
          document.getElementById("fingerprintDisplay").style.display = "block";
          return;
        }

        document.getElementById("fingerprintData").textContent = 
          JSON.stringify(window.f4Attributes, null, 2);
        document.getElementById("fingerprintDisplay").style.display = "block";
        console.log("📊 F4 Data:", window.f4Attributes);
      }

      function showF5Data() {
        if (!window.f5Attributes) {
          document.getElementById("fingerprintData").textContent = "F5 data not available yet.";
          document.getElementById("fingerprintDisplay").style.display = "block";
          return;
        }

        document.getElementById("fingerprintData").textContent = 
          JSON.stringify(window.f5Attributes, null, 2);
        document.getElementById("fingerprintDisplay").style.display = "block";
        console.log("🎨 F5 Data:", window.f5Attributes);
      }

      function showDeviceInfo() {
        if (!window.deviceInfo) {
          document.getElementById("fingerprintData").textContent = "Device info not available yet.";
          document.getElementById("fingerprintDisplay").style.display = "block";
          return;
        }

        document.getElementById("fingerprintData").textContent = 
          JSON.stringify(window.deviceInfo, null, 2);
        document.getElementById("fingerprintDisplay").style.display = "block";
        console.log("📱 Device Info:", window.deviceInfo);
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadMainScript();
        toggleStorageButton(false);
        // Start checking data availability
        checkDataAvailability();
      });

      async function collectIPs() {
        try {
          // Check if WebRTC data is available in window
          if (!window.webrtcData) {
            document.getElementById("fingerprintData").textContent =
              "WebRTC data not available yet. Please wait for fingerprinting to complete.";
            document.getElementById("fingerprintDisplay").style.display = "block";
            return;
          }

          const webrtcData = window.webrtcData;
          const formattedOutput = {
            localIPs: webrtcData.localIPs || [],
            publicIPs: webrtcData.publicIPs || [],
            relayIPs: webrtcData.relayIPs || [],
            flags: webrtcData.flags || {},
            timestamp: webrtcData.timestamp || new Date().toISOString(),
            error: webrtcData.error || null
          };

          document.getElementById("fingerprintData").textContent =
            JSON.stringify(formattedOutput, null, 2);
          document.getElementById("fingerprintDisplay").style.display = "block";
        } catch (error) {
          document.getElementById("fingerprintData").textContent =
            "Error: " + error.message;
          document.getElementById("fingerprintDisplay").style.display = "block";
        }
      }

      async function generateHash() {
        try {
          // Check if data is available
          if (!window.deviceInfo) {
            document.getElementById("hashValue").textContent =
              "Device info not available yet. Please wait for fingerprinting to complete.";
            document.getElementById("hashDisplay").style.display = "block";
            return;
          }

          // Use the hashes that are already generated in deviceInfo
          const deviceInfo = window.deviceInfo;
          let hashInfo = "";
          
          if (deviceInfo.f4Hashed) {
            hashInfo += `F4 Hash: ${deviceInfo.f4Hashed}\n`;
          }
          
          if (deviceInfo.f5Hashed) {
            hashInfo += `F5 Hash: ${deviceInfo.f5Hashed}\n`;
          }

          // Generate a combined hash from all available data
          const allData = {
            f4: window.f4Attributes,
            f5: window.f5Attributes,
            webrtc: window.webrtcData,
            deviceInfo: window.deviceInfo
          };

          const combinedDataString = JSON.stringify(allData);
          const combinedHash = btoa(combinedDataString).substring(0, 32); // Simple hash for demo

          hashInfo += `Combined Hash: ${combinedHash}`;

          document.getElementById("hashValue").innerHTML = hashInfo.replace(/\n/g, '<br>');
          document.getElementById("hashDisplay").style.display = "block";

          console.log("Generated hashes:", {
            f4Hash: deviceInfo.f4Hashed,
            f5Hash: deviceInfo.f5Hashed,
            combinedHash: combinedHash
          });
        } catch (error) {
          document.getElementById("hashValue").textContent =
            "Error: " + error.message;
          document.getElementById("hashDisplay").style.display = "block";
        }
      }

      async function sendToServer() {
        try {
          // Check if data is available
          if (!window.deviceInfo) {
            document.getElementById("serverData").textContent =
              "Device info not available yet. Please wait for fingerprinting to complete.";
            document.getElementById("serverResponse").style.display = "block";
            return;
          }

          // Prepare data to send (use deviceInfo which contains encoded data)
          const dataToSend = {
            deviceInfo: window.deviceInfo,
            f4Data: window.f4Attributes,
            f5Data: window.f5Attributes,
            webrtcData: window.webrtcData,
            timestamp: new Date().toISOString()
          };

          // Send to server using fetch
          const response = await fetch("/api/fingerprint", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(dataToSend),
          });

          if (response.ok) {
            const responseData = await response.json();
            console.log("Server response:", responseData);
            document.getElementById("serverData").textContent =
              JSON.stringify(responseData, null, 2);
          } else {
            document.getElementById("serverData").textContent =
              `Server error: ${response.status} ${response.statusText}`;
          }
          
          document.getElementById("serverResponse").style.display = "block";

        } catch (error) {
          document.getElementById("serverData").textContent =
            "Error: " + error.message;
          document.getElementById("serverResponse").style.display = "block";
          console.error("❌ Error sending to server:", error);
        }
      }

      // Removed auto-collect since it's now handled in loadActivatorThenOthers
      // window.addEventListener('load', function() {
      //     setTimeout(collectFingerprint, 1000);
      // });

      // Storage Management Functions
      async function getStorageData() {
        // Check if scripts are loaded before proceeding
        if (!scriptsLoaded) {
          alert(
            "⏳ Vui lòng đợi scripts load xong trước khi get storage data!"
          );
          return;
        }

        try {
          // Get tagging first (as before)
          const tagging = window.TaggingValue;

          // Get all storage values for both keys
          const storageData = await getAllStorageValues();

          const result = {
            tagging: tagging,
            storage: storageData,
          };

          document.getElementById("storageData").textContent = JSON.stringify(
            result,
            null,
            2
          );
          document.getElementById("storageDisplay").style.display = "block";
        } catch (error) {
          document.getElementById("storageData").textContent =
            "Error: " + error.message;
          document.getElementById("storageDisplay").style.display = "block";
        }
      }

      // Function to get all storage values for both old and new keys
      async function getAllStorageValues() {
        const oldKey = "(global.c3)";
        const newKey = "pwr_client_sync";

        const storageResults = {
          indexedDB: {
            oldKey: null,
            newKey: null,
          },
          localStorage: {
            oldKey: null,
            newKey: null,
          },
          cookies: {
            oldKey: null,
            newKey: null,
          },
          cacheAPI: {
            value: null,
          },
          windowName: {
            value: null,
          },
        };

        try {
          // IndexedDB
          storageResults.indexedDB.oldKey = await getIndexedDBValue(oldKey);
          storageResults.indexedDB.newKey = await getIndexedDBValue(newKey);

          // LocalStorage
          storageResults.localStorage.oldKey = getLocalStorageValue(oldKey);
          storageResults.localStorage.newKey = getLocalStorageValue(newKey);

          // Cookies
          storageResults.cookies.oldKey = getCookieValue("gfp");
          storageResults.cookies.newKey = getCookieValue(newKey);

          // Cache API (stub)
          storageResults.cacheAPI.value = await getCacheAPIValue(newKey);

          // WindowName
          storageResults.windowName.value = getWindowNameValue(newKey);
        } catch (error) {}

        return storageResults;
      }

      // IndexedDB getter
      async function getIndexedDBValue(key) {
        return new Promise((resolve) => {
          try {
            const indexedDbObj =
              window.indexedDB ||
              window.mozIndexedDB ||
              window.webkitIndexedDB ||
              window.msIndexedDB ||
              window.shimIndexedDB;

            if (!indexedDbObj) {
              resolve(null);
              return;
            }

            const request = indexedDbObj.open("indexedDB_ec", 3);

            request.onerror = function () {
              resolve(null);
            };

            request.onsuccess = function (event) {
              try {
                const db = event.target.result;

                if (db && db.objectStoreNames.contains("ec")) {
                  const transaction = db.transaction(["ec"], "readonly");
                  const objectStore = transaction.objectStore("ec");
                  const getRequest = objectStore.get(key);

                  getRequest.onsuccess = function () {
                    resolve(getRequest.result ? getRequest.result.value : null);
                  };

                  getRequest.onerror = function () {
                    resolve(null);
                  };
                } else {
                  resolve(null);
                }
              } catch (exception) {
                resolve(null);
              }
            };

            request.onupgradeneeded = function () {
              resolve(null);
            };
          } catch (exception) {
            resolve(null);
          }
        });
      }

      // LocalStorage getter
      function getLocalStorageValue(key) {
        try {
          if (window.localStorage) {
            return window.localStorage.getItem(key);
          }
          return null;
        } catch (exception) {
          return null;
        }
      }

      // Cookie getter
      function getCookieValue(key) {
        try {
          const name = key + "=";
          const ca = document.cookie.split(";");

          for (let i = 0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) === " ") {
              c = c.substring(1);
            }
            if (c.indexOf(name) === 0) {
              return c.substring(name.length, c.length);
            }
          }
          return null;
        } catch (error) {
          return null;
        }
      }

      // Cache API getter (stub implementation)
      async function getCacheAPIValue(key) {
        try {
          if ("caches" in window) {
            const cache = await caches.open(key);
            const response = await cache.match(new Request(`/cache/${key}`));

            if (response) {
              const data = await response.text();
              return data;
            }
          }
          return null;
        } catch (exception) {
          return null;
        }
      }

      function getWindowNameValue(key) {
        try {
          if (typeof window === "undefined") {
            return null;
          }

          const currentValue = window.name;

          if (!currentValue || currentValue.trim() === "") {
            return null;
          }

          return currentValue;
        } catch (exception) {
          console.warn("WindowName get exception:", exception);
          return null;
        }
      }
    </script>
  </body>
</html>
