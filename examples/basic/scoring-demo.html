<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS Scoring Module - Demo</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }
      .container {
        background: white;
        border-radius: 10px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #333;
        text-align: center;
        margin-bottom: 30px;
      }
      .scoring-display {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 5px;
        padding: 20px;
        margin: 20px 0;
        font-family: "Courier New", monospace;
        font-size: 14px;
        max-height: 600px;
        overflow-y: auto;
      }
      .button {
        background: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 10px 5px;
        font-size: 16px;
      }
      .button:hover {
        background: #0056b3;
      }
      .button:disabled {
        background: #6c757d;
        cursor: not-allowed;
        opacity: 0.6;
      }
      .status-display {
        background: #e3f2fd;
        border-left: 4px solid #2196f3;
        padding: 15px;
        margin: 15px 0;
        border-radius: 4px;
      }
      .status-item {
        margin: 8px 0;
        padding: 8px;
        background: white;
        border-radius: 3px;
      }
      .status-item.success {
        background: #d4edda;
        border-left: 3px solid #28a745;
      }
      .status-item.error {
        background: #f8d7da;
        border-left: 3px solid #dc3545;
      }
      .status-item.pending {
        background: #fff3cd;
        border-left: 3px solid #ffc107;
      }
      .info-display {
        background: #e8f5e9;
        border: 2px solid #4caf50;
        border-radius: 5px;
        padding: 15px;
        margin: 15px 0;
      }
      .hidden-field-display {
        background: #fff3cd;
        border: 2px solid #ffc107;
        border-radius: 5px;
        padding: 15px;
        margin: 15px 0;
      }
      .hidden-field-item {
        margin: 8px 0;
        padding: 8px;
        background: white;
        border-radius: 3px;
        font-family: monospace;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📊 FPS Scoring Module Demo</h1>
      
      <div style="text-align: center">
        <button class="button" onclick="showScoringData()" id="showDataButton" disabled>
          📋 Show Collected Data
        </button>
        <button class="button" onclick="showHiddenFields()" id="showFieldsButton" disabled>
          🔍 Show Hidden Fields
        </button>
        <button class="button" onclick="checkStatus()">
          🔄 Refresh Status
        </button>
      </div>

      <!-- Status Display -->
      <div id="statusDisplay" class="status-display">
        <h3>📊 Status:</h3>
        <div id="statusInfo">
          <p>⏳ Initializing...</p>
        </div>
      </div>

      <!-- Info Display -->
      <div id="infoDisplay" class="info-display" style="display: none">
        <h3>ℹ️ Server Info:</h3>
        <div id="infoContent"></div>
      </div>

      <!-- Hidden Fields Display -->
      <div id="hiddenFieldsDisplay" class="hidden-field-display" style="display: none">
        <h3>🔍 Hidden Fields:</h3>
        <div id="hiddenFieldsContent"></div>
      </div>

      <!-- Scoring Data Display -->
      <div
        id="scoringDisplay"
        class="scoring-display"
        style="display: none"
      >
        <h3>Collected Scoring Data:</h3>
        <pre id="scoringData"></pre>
      </div>
    </div>

    <script>
      let scoringVersion = null;
      let scoringScriptLoaded = false;

      // Step 1: Get version from /libs/info
      async function getScoringVersion() {
        try {
          const response = await fetch('/libs/info');
          if (response.ok) {
            const data = await response.json();
            scoringVersion = data.version;
            updateStatus('version', `✅ Version loaded: ${scoringVersion}`, 'success');
            return scoringVersion;
          } else {
            throw new Error(`HTTP ${response.status}`);
          }
        } catch (error) {
          updateStatus('version', `❌ Failed to get version: ${error.message}`, 'error');
          return null;
        }
      }

      // Step 2: Load scoring script with version
      function loadScoringScript(version) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          const versionParam = version ? `?version=${version}` : '';
          script.src = `/libs/utils-core.min.js${versionParam}`;
          
          script.onload = () => {
            scoringScriptLoaded = true;
            updateStatus('script', '✅ Scoring script loaded successfully', 'success');
            resolve();
          };
          
          script.onerror = () => {
            updateStatus('script', '❌ Failed to load scoring script', 'error');
            reject(new Error('Failed to load scoring script'));
          };
          
          document.head.appendChild(script);
        });
      }

      // Wait for window data to be loaded (start() is called automatically in script)
      function waitForScoringData() {
        const maxAttempts = 20; // Wait up to 10 seconds (20 * 500ms)
        let attempts = 0;

        const checkInterval = setInterval(() => {
          attempts++;
          
          // Check if data is available in window
          if (typeof window.scoringGroup !== 'undefined' && typeof window.scoringSessionKey !== 'undefined') {
            clearInterval(checkInterval);
            updateStatus('collection', '✅ Scoring collection completed successfully', 'success');
            
            // Enable buttons
            document.getElementById('showDataButton').disabled = false;
            document.getElementById('showFieldsButton').disabled = false;

            // Auto-show data after collection
            setTimeout(() => {
              showScoringData();
            }, 500);
          } else if (attempts >= maxAttempts) {
            clearInterval(checkInterval);
            updateStatus('collection', '❌ Timeout waiting for scoring data. Data may not be available yet.', 'error');
          } else {
            updateStatus('collection', `🔄 Waiting for scoring data... (${attempts}/${maxAttempts})`, 'pending');
          }
        }, 500);
      }

      // Show collected scoring data from window
      function showScoringData() {
        try {
          // Get data from window objects (set by start())
          const scoringGroup = window.scoringGroup || null;
          const scoringSessionKey = window.scoringSessionKey || null;

          // Get hidden field value
          const skField = document.querySelector('input[name="__sk"]') || 
                         document.querySelector('input[id="__sk"]');
          const skValue = skField ? skField.value : null;

          // Get session storage
          const sessionKeyData = sessionStorage.getItem('__SESSION_KEY__');
          let sessionData = null;
          
          if (sessionKeyData) {
            try {
              sessionData = JSON.parse(sessionKeyData);
            } catch (e) {
              sessionData = { raw: sessionKeyData };
            }
          }

          const displayData = {
            timestamp: new Date().toISOString(),
            version: scoringVersion,
            sessionKey: {
              fromWindow: scoringSessionKey,
              fromHiddenField: skValue,
              fromStorage: sessionData
            },
            scoringGroup: scoringGroup
          };

          document.getElementById('scoringData').textContent = JSON.stringify(displayData, null, 2);
          document.getElementById('scoringDisplay').style.display = 'block';

        } catch (error) {
          document.getElementById('scoringData').textContent = `Error: ${error.message}`;
          document.getElementById('scoringDisplay').style.display = 'block';
          console.error('Error showing scoring data:', error);
        }
      }

      // Show hidden fields
      function showHiddenFields() {
        try {
          const skField = document.querySelector('input[name="__sk"]') || 
                         document.querySelector('input[id="__sk"]');
          
          let html = '';
          
          if (skField) {
            html += `
              <div class="hidden-field-item">
                <strong>__sk:</strong> ${skField.value || '(empty)'}
              </div>
            `;
          } else {
            html += `
              <div class="hidden-field-item">
                <strong>__sk:</strong> Field not found
              </div>
            `;
          }

          // Check session storage
          const sessionKeyData = sessionStorage.getItem('__SESSION_KEY__');
          if (sessionKeyData) {
            html += `
              <div class="hidden-field-item">
                <strong>Session Storage (__SESSION_KEY__):</strong> ${sessionKeyData}
              </div>
            `;
          }

          document.getElementById('hiddenFieldsContent').innerHTML = html;
          document.getElementById('hiddenFieldsDisplay').style.display = 'block';

        } catch (error) {
          document.getElementById('hiddenFieldsContent').innerHTML = `Error: ${error.message}`;
          document.getElementById('hiddenFieldsDisplay').style.display = 'block';
        }
      }

      // Update status display
      function updateStatus(key, message, type = 'info') {
        const statusInfo = document.getElementById('statusInfo');
        const statusItem = document.getElementById(`status-${key}`);
        
        const itemHtml = `
          <div id="status-${key}" class="status-item ${type}">
            ${message}
          </div>
        `;

        if (statusItem) {
          statusItem.outerHTML = itemHtml;
        } else {
          statusInfo.innerHTML += itemHtml;
        }
      }

      // Check current status
      function checkStatus() {
        const status = {
          version: scoringVersion ? `✅ ${scoringVersion}` : '❌ Not loaded',
          script: scoringScriptLoaded ? '✅ Loaded' : '❌ Not loaded',
          collector: typeof window.ScoringCollector !== 'undefined' ? '✅ Available' : '❌ Not available',
          scoringGroup: typeof window.scoringGroup !== 'undefined' ? '✅ Available' : '❌ Not available',
          scoringSessionKey: typeof window.scoringSessionKey !== 'undefined' ? '✅ Available' : '❌ Not available',
          sessionKey: sessionStorage.getItem('__SESSION_KEY__') ? '✅ Stored' : '❌ Not stored',
          hiddenField: document.querySelector('input[name="__sk"]') || document.querySelector('input[id="__sk"]') ? '✅ Found' : '❌ Not found'
        };

        let statusHtml = '';
        for (const [key, value] of Object.entries(status)) {
          statusHtml += `<div class="status-item ${value.includes('✅') ? 'success' : 'error'}"><strong>${key}:</strong> ${value}</div>`;
        }

        document.getElementById('statusInfo').innerHTML = statusHtml;
      }

      // Initialize on page load
      document.addEventListener('DOMContentLoaded', async () => {
        updateStatus('init', '🔄 Initializing scoring demo...', 'pending');

        try {
          // Step 1: Get version
          const version = await getScoringVersion();
          
          if (version) {
            // Show version info
            document.getElementById('infoContent').innerHTML = `
              <p><strong>Version:</strong> ${version}</p>
              <p><strong>Script URL:</strong> /libs/utils-core.min.js?version=${version}</p>
            `;
            document.getElementById('infoDisplay').style.display = 'block';
            
            // Step 2: Load script with version
            await loadScoringScript(version);
            
            // Step 3: Wait for window data to be loaded (start() is called automatically in script)
            setTimeout(() => {
              waitForScoringData();
            }, 500);
            
            updateStatus('init', '✅ Initialization complete', 'success');
          } else {
            updateStatus('init', '❌ Failed to get version, cannot load script', 'error');
          }
        } catch (error) {
          updateStatus('init', `❌ Initialization failed: ${error.message}`, 'error');
          console.error('Initialization error:', error);
        }
      });
    </script>
  </body>
</html>
