version: '3.8'

services:
  fps-app:
    build:
      context: .
      target: local
    ports:
      - "5000:5000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=local
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - fps-network
    depends_on:
      - redis-local
      - postgres-local

  redis-local:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - fps-network

  postgres-local:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=fps_local
      - POSTGRES_USER=fps_local_user
      - POSTGRES_PASSWORD=local_password
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    networks:
      - fps-network

volumes:
  postgres_local_data:

networks:
  fps-network:
    driver: bridge
